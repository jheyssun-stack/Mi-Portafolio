<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" role="img" aria-labelledby="t d"><title id="t">Semana 11 · Método 10 – Recorrer la lista circular</title><desc id="d">Infografía de estudio de Método 10 – Recorrer la lista circular. Recorre todos los nodos y muestra los alumnos registrados, finalizando al regresar al primer nodo para evitar un ciclo infinito.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#0f766e" stop-opacity=".45"/></linearGradient></defs><rect width="1440" height="1050" rx="35" fill="url(#g)"/><circle cx="1280" cy="100" r="180" fill="#5eead4" opacity=".06"/><text x="95" y="95" class="kicker">PORTAFOLIO ACADÉMICO · SEMANA 11 · INFOGRAFÍA 29</text><text x="95" y="180" class="title">Método 10 – Recorrer la lista circular</text><path d="M95 235H1345" stroke="#5eead4" opacity=".5" stroke-width="3"/><text x="95" y="300" class="subtitle">Método 10 – Recorrer la lista circular</text><text x="95" y="385" class="label">IDEA PRINCIPAL</text><text x="95" y="430" class="body">Recorre todos los nodos y muestra los alumnos registrados, finalizando al regresar al primer nodo para evitar un ciclo infinito.</text><text x="95" y="530" class="label">LECTURA DEL MÉTODO</text><text x="95" y="575" class="body">Método 10 – Recorrer la lista circular</text><text x="95" y="620" class="body">Estructura de datos · operación paso a paso · revisión de enlaces</text><path d="M520 660v190m0-190h420M520 720h360M520 780h300M520 840h240" stroke="#5eead4" stroke-width="5"/><rect x="450" y="645" width="140" height="48" rx="10" fill="#0f766e"/><rect x="450" y="705" width="140" height="48" rx="10" fill="#0f766e" opacity=".85"/><rect x="450" y="765" width="140" height="48" rx="10" fill="#0f766e" opacity=".7"/><rect x="450" y="825" width="140" height="48" rx="10" fill="#0f766e" opacity=".55"/><text x="1030" y="690" class="small">Método 10 – Recorrer l</text><text x="1030" y="750" class="small">RESULTADO</text><text x="1030" y="810" class="small">VALIDAR</text><rect x="70" y="920" width="1300" height="78" rx="18" fill="#000" opacity=".28"/><text x="100" y="954" class="foot">Jheyssun Breydi Vargas Taipe</text><text x="100" y="982" class="note">Lámina de estudio con diseño original · consulta y verifica con el material del curso</text><text x="1330" y="970" class="kicker" text-anchor="end">UPLA</text><style>.kicker{font:700 18px 'Segoe UI',Arial;letter-spacing:2.4px;fill:#5eead4}.title{font:800 48px 'Segoe UI',Arial;fill:#fff}.subtitle{font:700 24px 'Segoe UI',Arial;fill:#ecfdf5}.label{font:800 18px 'Segoe UI',Arial;letter-spacing:1.8px;fill:#5eead4}.body{font:500 22px 'Segoe UI',Arial;fill:#f7faff}.small{font:700 18px 'Segoe UI',Arial;fill:#fff;text-anchor:middle}.node{font:700 17px 'Segoe UI',Arial;fill:#fff;text-anchor:middle}.foot{font:800 23px 'Segoe UI',Arial;fill:#fff}.note{font:500 15px 'Segoe UI',Arial;fill:#dce7f4}</style></svg>