xt><rect x="70" y="920" width="1300" height="78" rx="18" fill="#000" opacity=".28"/><text x="100" y="954" class="foot">Jheyssun Breydi Vargas Taipe</text><text x="100" y="982" class="note">Lámina de estudio con diseño original · consulta y verifica con el material del curso</text><text x="1330" y="970" class="kicker" text-anchor="end">UPLA</text><style>.kicker{font:700 18px 'Segoe UI',Arial;letter-spacing:2.4px;fill:#5eead4}.title{font:800 48px 'Segoe UI',Arial;fill:#fff}.subtitle{font:700 24px 'Segoe UI',Arial;fill:#ecfdf5}.label{font:800 18px 'Segoe UI',Arial;letter-spacing:1.8px;fill:#5eead4}.body{font:500 22px 'Segoe UI',Arial;fill:#f7faff}.small{font:700 18px 'Segoe UI',Arial;fill:#fff;text-anchor:middle}.node{font:700 17px 'Segoe UI',Arial;fill:#fff;text-anchor:middle}.foot{font:800 23px 'Segoe UI',Arial;fill:#fff}.note{font:500 15px 'Segoe UI',Arial;fill:#dce7f4}</style></svg>