<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" role="img" aria-labelledby="t d"><title id="t">Semana 11 · Método 13 – Consultar próximo paciente</title><desc id="d">Infografía de estudio de Método 13 – Consultar próximo paciente. Muestra los datos del siguiente paciente que será atendido, sin eliminarlo ni alterar la estructura circular.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#0f766e" stop-opacity=".45"/></linearGradient></defs><rect width="1440" height="1050" rx="35" fill="url(#g)"/><circle cx="1280" cy="100" r="180" fill="#5eead4" opacity=".06"/><text x="95" y="95" class="kicker">PORTAFOLIO ACADÉMICO · SEMANA 11 · INFOGRAFÍA 14</text><text x="95" y="180" class="title">Método 13 – Consultar próximo paciente</text><path d="M95 235H1345" stroke="#5eead4" opacity=".5" stroke-width="3"/><text x="95" y="300" class="subtitle">Método 13 – Consultar próximo paciente</text><text x="95" y="385" class="label">IDEA PRINCIPAL</text><text x="95" y="430" class="body">Muestra los datos del siguiente paciente que será atendido, sin eliminarlo ni alterar la estructura circular.</text><text x="95" y="530" class="label">LECTURA DEL MÉTODO</text><text x="95" y="575" class="body">Método 13 – Consultar próximo paciente</text><text x="95" y="620" class="body">Estructura de datos · operación paso a paso · revisión de enlaces</text><path d="M150 790V690H470V760H800V660H1110V780H1300" fill="none" stroke="#5eead4" stroke-width="7"/><circle cx="150" cy="790" r="16" fill="#0f766e"/><circle cx="470" cy="690" r="16" fill="#0f766e"/><circle cx="800" cy="760" r="16" fill="#0f766e"/><circle cx="1110" cy="660" r="16" fill="#0f766e"/><text x="150" y="850" class="small">Método 13 – Consultar </text><text x="470" y="650" class="small">RESULTADO</text><text x="800" y="820" class="small">VALIDAR</text><rect x="70" y="920" width="1300" height="78" rx="18" fill="#000" opacity=".28"/><text x="100" y="954" class=