<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" role="img" aria-labelledby="t d"><title id="t">Semana 11 · Método 4 – Registrar paciente por referencia</title><desc id="d">Infografía de estudio de Método 4 – Registrar paciente por referencia. Inserta un nuevo paciente después de otro identificado por su código, actualizando correctamente los enlaces de la lista circular.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#0f766e" stop-opacity=".45"/></linearGradient></defs><rect width="1440" height="1050" rx="35" fill="url(#g)"/><circle cx="1280" cy="100" r="180" fill="#5eead4" opacity=".06"/><text x="95" y="95" class="kicker">PORTAFOLIO ACADÉMICO · SEMANA 11 · INFOGRAFÍA 05</text><text x="95" y="180" class="title">Método 4 – Registrar paciente por referencia</text><path d="M95 235H1345" stroke="#5eead4" opacity=".5" stroke-width="3"/><text x="95" y="300" class="subtitle">Método 4 – Registrar paciente por referencia</text><text x="95" y="385" class="label">IDEA PRINCIPAL</text><text x="95" y="430" class="body">Inserta un nuevo paciente después de otro identificado por su código, actualizando correctamente los enlaces de la lista circular.</text><text x="95" y="530" class="label">LECTURA DEL MÉTODO</text><text x="95" y="575" class="body">Método 4 – Registrar paciente por referencia</text><text x="95" y="620" class="body">Estructura de datos · operación paso a paso · revisión de enlaces</text><ellipse cx="720" cy="735" rx="300" ry="115" fill="none" stroke="#5eead4" stroke-width="7" stroke-dasharray="16 12"/><circle cx="470" cy="735" r="62" fill="#0f766e"/><circle cx="720" cy="620" r="62" fill="#0f766e"/><circle cx="970" cy="735" r="62" fill="#0f766e"/><text x="470" y="743" class="node">Método 4 – Registrar p</text><text x="720" y="628" class="node">RESULTADO</text><text x="970" y="743" class="node">VALIDAR</text><text x="720" y="900" class="small">Recorrer una vuelta y detenerse al completar el ciclo</text><rect x="70" y="920" width="1300" height="78" rx="18" fill="#000" opacity=".28"/><text x="100" y="954" class="foot">Jheyssun Breydi Vargas Taipe</text><text x="100" y="982" class="note">Lámina de estudio con diseño original · consulta y verifica con el material del curso</text><text x="1330" y="970" class="kicker" text-anchor="end">UPLA</text><style>.kicker{font:700 18px 'Segoe UI',Arial;letter-spacing:2.4px;fill:#5eead4}.title{font:800 48px 'Segoe UI',Arial;fill:#fff}.subtitle{font:700 24px 'Segoe UI',Arial;fill:#ecfdf5}.label{font:800 18px 'Segoe UI',Arial;letter-spacing:1.8px;fill:#5eead4}.body{font:500 22px 'Segoe UI',Arial;fill:#f7faff}.small{font:700 18px 'Segoe UI',Arial;fill:#fff;text-anchor:middle}.node{font:700 17px 'Segoe UI',Arial;fill:#fff;text-anchor:middle}.foot{font:800 23px 'Segoe UI',Arial;fill:#fff}.note{font:500 15px 'Segoe UI',Arial;fill:#dce7f4}</style></svg>