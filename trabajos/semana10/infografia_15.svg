<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" role="img" aria-labelledby="t d"><title id="t">Semana 10 · Método 4 – Insertar alumno por referencia</title><desc id="d">Infografía de estudio de Método 4 – Insertar alumno por referencia. Inserta un nuevo alumno después de otro existente, utilizando su referencia para conectar los nodos.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141321"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".45"/></linearGradient></defs><rect width="1440" height="1050" rx="35" fill="url(#g)"/><circle cx="1280" cy="100" r="180" fill="#c4b5fd" opacity=".06"/><text x="95" y="95" class="kicker">PORTAFOLIO ACADÉMICO · SEMANA 10 · INFOGRAFÍA 15</text><text x="95" y="180" class="title">Método 4 – Insertar alumno por referencia</text><path d="M95 235H1345" stroke="#c4b5fd" opacity=".5" stroke-width="3"/><text x="95" y="300" class="subtitle">Método 4 – Insertar alumno por referencia</text><text x="95" y="385" class="label">IDEA PRINCIPAL</text><text x="95" y="430" class="body">Inserta un nuevo alumno después de otro existente, utilizando su referencia para conectar los nodos.</text><text x="95" y="530" class="label">LECTURA DEL MÉTODO</text><text x="95" y="575" class="body">Método 4 – Insertar alumno por referencia</text><text x="95" y="620" class="body">Estructura de datos · operación paso a paso · revisión de enlaces</text><path d="M150 790V690H470V760H800V660H1110V780H1300" fill="none" stroke="#c4b5fd" stroke-width="7"/><circle cx="150" cy="790" r="16" fill="#8b5cf6"/><circle cx="470" cy="690" r="16" fill="#8b5cf6"/><circle cx="800" cy="760" r="16" fill="#8b5cf6"/><circle cx="1110" cy="660" r="16" fill="#8b5cf6"/><text x="150" y="850" class="small">Método 4 – Insertar al</text><text x="470" y="650" class="small">INICIO</text><text x="800" y="820" class="small">DATO</text><rect x="70" y="920" width="1300" height="78" rx="18" fill="#000" opacity=".28"/><text x="100" y="954" class="foot">Jh