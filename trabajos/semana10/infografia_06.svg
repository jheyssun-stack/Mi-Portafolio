<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1050" role="img" aria-labelledby="t d"><title id="t">Semana 10 · Método 13 – Intercambiar dos alumnos</title><desc id="d">Infografía de estudio de Método 13 – Intercambiar dos alumnos. Busca dos alumnos mediante sus códigos e intercambia sus posiciones lógicas dentro de la lista.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141321"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".45"/></linearGradient></defs><rect width="1440" height="1050" rx="35" fill="url(#g)"/><circle cx="1280" cy="100" r="180" fill="#c4b5fd" opacity=".06"/><text x="95" y="95" class="kicker">PORTAFOLIO ACADÉMICO · SEMANA 10 · INFOGRAFÍA 06</text><text x="95" y="180" class="title">Método 13 – Intercambiar dos alumnos</text><path d="M95 235H1345" stroke="#c4b5fd" opacity=".5" stroke-width="3"/><text x="95" y="300" class="subtitle">Método 13 – Intercambiar dos alumnos</text><text x="95" y="385" class="label">IDEA PRINCIPAL</text><text x="95" y="430" class="body">Busca dos alumnos mediante sus códigos e intercambia sus posiciones lógicas dentro de la lista.</text><text x="95" y="530" class="label">LECTURA DEL MÉTODO</text><text x="95" y="575" class="body">Método 13 – Intercambiar dos alumnos</text><text x="95" y="620" class="body">Estructura de datos · operación paso a paso · revisión de enlaces</text><ellipse cx="720" cy="735" rx="300" ry="115" fill="none" stroke="#c4b5fd" stroke-width="7" stroke-dasharray="16 12"/><circle cx="470" cy="735" r="62" fill="#8b5cf6"/><circle cx="720" cy="620" r="62" fill="#8b5cf6"/><circle cx="970" cy="735" r="62" fill="#8b5cf6"/><text x="470" y="743" class="node">Método 13 – Intercambi</text><text x="720" y="628" class="node">INICIO</text><text x="970" y="743" class="node">DATO</text><text x="720" y="900" class="small">Recorrer una vuelta y detenerse al completar el ciclo</text><rect x="70" y="920" width="1300" height="78" rx="18" fill="#000" opacity=".28"/><text x="100" y="954" class="foot">Jheyssun Breydi Vargas Taipe</text><text x="100" y="982" class="note">Lámina de estudio con diseño original · consulta y verifica con el material del curso</text><text x="1330" y="970" class="kicker" text-anchor="end">UPLA</text><style>.kicker{font:700 18px 'Segoe UI',Arial;letter-spacing:2.4px;fill:#c4b5fd}.title{font:800 48px 'Segoe UI',Arial;fill:#fff}.subtitle{font:700 24px 'Segoe UI',Arial;fill:#f5f3ff}.label{font:800 18px 'Segoe UI',Arial;letter-spacing:1.8px;fill:#c4b5fd}.body{font:500 22px 'Segoe UI',Arial;fill:#f7faff}.small{font:700 18px 'Segoe UI',Arial;fill:#fff;text-anchor:middle}.node{font:700 17px 'Segoe UI',Arial;fill:#fff;text-anchor:middle}.foot{font:800 23px 'Segoe UI',Arial;fill:#fff}.note{font:500 15px 'Segoe UI',Arial;fill:#dce7f4}</style></svg>