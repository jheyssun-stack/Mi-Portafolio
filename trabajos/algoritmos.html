<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Algoritmos | Portafolio Académico</title>
<link rel="stylesheet" href="../css/cloud.css">
<link rel="stylesheet" href="../css/jheyvx.css">

<style>
:root {
  --bg: #07111f;
  --panel: #101d31;
  --text: #eef4ff;
  --muted: #9eb0c9;
  --accent: #7c6cff;
  --line: rgba(255,255,255,.12);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", Arial, sans-serif;
  background: radial-gradient(circle at top, #182a48, #07111f 60%);
  color: var(--text);
  line-height: 1.6;
}

a { color: inherit; text-decoration: none; }

.wrap {
  width: min(1150px, 92%);
  margin: auto;
}

.top {
  padding: 25px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.brand { font-weight: 800; }
.brand span { color: #a99cff; }

.back, .btn {
  display: inline-block;
  padding: 10px 15px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #ffffff09;
}

.hero { padding: 35px 0; }

.eyebrow {
  color: #b8adff;
  font-weight: 800;
  letter-spacing: 2px;
}

.hero h1 {
  font-size: clamp(2.5rem, 7vw, 4.8rem);
  margin: 12px 0;
  line-height: 1.1;
}

.hero p, .week p, .status, .notice {
  color: var(--muted);
}

.weeks {
  display: grid;
  gap: 15px;
  padding-bottom: 60px;
}

.week {
  background: linear-gradient(145deg, #15253d, #091423);
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
}

.week > summary {
  list-style: none;
  cursor: pointer;
  padding: 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.week > summary::-webkit-details-marker,
.group > summary::-webkit-details-marker {
  display: none;
}

.week > summary:hover,
.group > summary:hover {
  background: #ffffff08;
}

.week-title {
  display: flex;
  gap: 15px;
  align-items: center;
}

.number {
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: 14px;
  background: #7c6cff24;
  color: #cfc8ff;
  font-weight: 900;
}

.week h2 { font-size: 1.15rem; margin: 0; }
.week p { margin: 4px 0 0; }

.pill {
  border: 1px solid #7c6cff66;
  background: #7c6cff20;
  color: #d4ceff;
  border-radius: 999px;
  padding: 6px 10px;
  font-size: .8rem;
  white-space: nowrap;
}

.inside {
  padding: 18px 24px 24px;
  border-top: 1px solid var(--line);
}

.groups {
  display: grid;
  gap: 12px;
  margin-top: 15px;
}

.group {
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: #ffffff03;
}

.group > summary {
  padding: 17px;
  font-weight: 750;
  cursor: pointer;
}

.group[open] > summary {
  border-bottom: 1px solid var(--line);
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 14px;
  padding: 15px;
}

.card {
  border: 1px solid var(--line);
  border-radius: 13px;
  overflow: hidden;
  background: #ffffff05;
  min-width: 0;
}

.card img {
  width: 100%;
  height: auto;
  max-height: 650px;
  object-fit: contain;
  display: block;
  background: #fff;
  cursor: zoom-in;
}

.cap {
  padding: 10px 12px;
  color: #cbd7ea;
  font-size: .9rem;
  overflow-wrap: anywhere;
}

.btn:hover {
  border-color: #b56cff;
  background: #7c6cff18;
}

.links {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.empty {
  padding: 18px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  color: var(--muted);
  margin-top: 12px;
}

.status { padding: 12px 0; }

footer {
  border-top: 1px solid var(--line);
  padding: 25px 0;
  color: var(--muted);
}

.lightbox {
  position: fixed;
  inset: 0;
  background: #02050bee;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 999;
}

.lightbox.open { display: flex; }

.lightbox img {
  max-width: 96vw;
  max-height: 90vh;
  object-fit: contain;
}

.close {
  position: absolute;
  right: 20px;
  top: 15px;
  font-size: 2rem;
  background: #182a48;
  border: 1px solid #ffffff40;
  color: white;
  border-radius: 10px;
  padding: 2px 14px;
  cursor: pointer;
}

@media(max-width: 600px) {
  .top { flex-direction: column; align-items: flex-start; }
  .week > summary { padding: 16px; }
  .inside { padding: 15px; }
  .week-title { gap: 10px; }
  .number { width: 42px; height: 42px; }
  .pill { font-size: .7rem; }
  .gallery { grid-template-columns: 1fr; }
}
</style>
<link rel="stylesheet" href="../css/portfolio-pages.css">
</head>

<body class="algorithm-course-page">
<div class="wrap">

<header class="top">
  <div class="brand">
    JV · <span>ALGORITMOS Y ESTRUCTURAS DE DATOS</span>
  </div>
  <a class="back" href="../index.html">← Volver al portafolio</a>
</header>

<section class="hero">
  <div class="eyebrow">PORTAFOLIO ACADÉMICO · UPLA</div>
  <h1>Algoritmos</h1>
  <p>
    Abre una semana para explorar las infografías disponibles.
    Las láminas resumen cada tema con diagramas y ejemplos de estudio.
  </p>
</section>

<main class="weeks" id="weeks"></main>

<footer>
  Portafolio Académico · Ingeniería de Sistemas y Computación · UPLA
</footer>

</div>

<div class="lightbox" id="lightbox">
  <button class="close" id="closeLightbox" aria-label="Cerrar">×</button>
  <img id="lightboxImg" alt="Imagen ampliada">
</div>

<script>
const OWNER = "jheyssun-stack";
const REPO = "Mi-Portafolio";
const BRANCH = "main";

const weeks = [
  {n:1, desc:"Ejercicios y trabajos de la Semana 1."},
  {n:2, desc:"Ejercicios y trabajos de la Semana 2."},
  {n:3, desc:"Ejercicios de programación en Java."},
  {n:4, desc:"Actividades y ejercicios de programación."},
  {n:5, desc:"Listas enlazadas en Java."},
  {n:6, desc:"Pilas, inventario y control de historial."},
  {n:7, desc:"Colas y procesamiento de datos."},
  {n:8, desc:"Árboles y recorridos."},
  {n:9, desc:"Recursividad: Ackermann, evaluación de expresiones, costos de productos y dependencias."},
  {n:10, desc:"16 infografías sobre operaciones de una lista simplemente enlazada de alumnos."},
  {n:11, desc:"33 infografías: lista circular de pacientes y operaciones circulares con alumnos."},
  {n:12, desc:"27 infografías sobre citas médicas y operaciones de listas doblemente enlazadas."},
  {n:13, desc:"Sin infografías publicadas todavía."},
  {n:14, desc:"Sin infografías publicadas todavía."},
  {n:15, desc:"Sin infografías publicadas todavía."},
  {n:16, desc:"Sin infografías publicadas todavía."}
];

const titles6 = {
  "enunciado6.1": "Enunciado 1 · Gestión de alumnos con pilas",
  "enunciado6.2": "Enunciado 2 · Inventario de computadoras",
  "enunciado6.3": "Enunciado 3 · Historial y control de versiones"
};

const imageExtensions = /\.(png|jpe?g|webp|gif|bmp|svg)$/i;
const weeksEl = document.getElementById("weeks");


function make(tag, cls, content) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (content !== undefined) el.textContent = content;
  return el;
}

function rawUrl(path) {
  const cleanPath = path
    .split("/")
    .filter(Boolean)
    .map(encodeURIComponent)
    .join("/");

  return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${cleanPath}`;
}


let algorithmManifestPromise;
async function findWeekFiles(n) {
  if (!algorithmManifestPromise) {
    algorithmManifestPromise = fetch("../assets/algorithm-images.json")
      .then(response => {
        if (!response.ok) throw new Error("No se pudo cargar el índice local de imágenes.");
        return response.json();
      });
  }
  const manifest = await algorithmManifestPromise;
  const entry = manifest[String(n)];
  if (!entry) return null;
  const asFile = path => ({ type: "file", name: path.split("/").pop(), path });
  return {
    files: entry.files.map(asFile),
    groups: entry.groups.map(group => ({ name: group.name, files: group.files.map(asFile) }))
  };
}

function addImageCard(gallery, file) {
  const card = make("article", "card");
  const img = document.createElement("img");
  const src = "../" + file.path.split("/").map(encodeURIComponent).join("/");
  img.src = src;
  img.alt = file.name;
  img.loading = "lazy";
  img.addEventListener("click", () => {
    document.getElementById("lightboxImg").src = src;
    document.getElementById("lightbox").classList.add("open");
  });
  img.onerror = () => card.remove();
  card.appendChild(img);
  card.appendChild(make("div", "cap", file.name));
  gallery.appendChild(card);
}

function createWeek(w) {
  const section = make("details", "week");
  section.dataset.cloudCourse = "algoritmos";
  section.dataset.cloudSection = `week-${String(w.n).padStart(2, "0")}`;
  const summary = document.createElement("summary");
  const left = make("div", "week-title");

  left.appendChild(
    make("span", "number", String(w.n).padStart(2, "0"))
  );

  const info = document.createElement("div");
  info.appendChild(make("h2", "", "Semana " + w.n));
  info.appendChild(make("p", "", w.desc));
  left.appendChild(info);

  summary.appendChild(left);
  summary.appendChild(make("span", "pill", "Abrir semana ↓"));

  section.appendChild(summary);

  const inside = make("div", "inside");
  inside.appendChild(make("p", "status", "Abre para cargar los trabajos."));
  section.appendChild(inside);

  section.addEventListener("toggle", () => {
    if (section.open && !section.dataset.loaded) {
      section.dataset.loaded = "true";
      loadWeek(w, inside);
    }
  });

  weeksEl.appendChild(section);
}

async function loadWeek(w, inside) {
  inside.replaceChildren();
  inside.appendChild(make("p", "status", "Cargando trabajos..."));
  try {
    const result = await findWeekFiles(w.n);
    inside.replaceChildren();
    if (!result) {
      inside.appendChild(make("div", "empty", `No hay imágenes locales registradas para la Semana ${w.n}.`));
      return;
    }
    if (result.files.length) {
      const gallery = make("div", "gallery");
      result.files.forEach(file => addImageCard(gallery, file));
      inside.appendChild(gallery);
    }
    if (result.groups.length) {
      const groups = make("div", "groups");
      result.groups.forEach(groupData => {
        const group = make("details", "group");
        const label = w.n === 6
          ? (titles6[groupData.name] || groupData.name.replace(/[-_]/g, " "))
          : groupData.name.replace(/[-_]/g, " ");
        group.appendChild(make("summary", "", label));
        const gallery = make("div", "gallery");
        group.appendChild(gallery);
        group.addEventListener("toggle", () => {
          if (!group.open || group.dataset.loaded) return;
          group.dataset.loaded = "true";
          groupData.files.forEach(file => addImageCard(gallery, file));
          if (!groupData.files.length) gallery.appendChild(make("div", "empty", "No hay imágenes en esta sección."));
        });
        groups.appendChild(group);
      });
      inside.appendChild(groups);
    }
    if (!result.files.length && !result.groups.length) {
      inside.appendChild(make("div", "empty", "No hay imágenes locales en esta semana. Si agregaste archivos desde el panel, revisa el bloque de archivos de la nube."));
    }
    if (w.n === 6) {
      const zip = make("a", "btn", "Descargar ZIP de Semana 6");
      zip.href = rawUrl("semana6.zip");
      zip.target = "_blank";
      zip.rel = "noopener";
      const links = make("div", "links");
      links.appendChild(zip);
      inside.appendChild(links);
    }
  } catch (error) {
    inside.replaceChildren(make("div", "empty", "No se pudo cargar el índice local. Recarga la página en unos minutos."));
    console.error(error);
  }
}

weeks.forEach(createWeek);

const lightbox = document.getElementById("lightbox");

document.getElementById("closeLightbox").onclick = () => {
  lightbox.classList.remove("open");
};

lightbox.addEventListener("click", event => {
  if (event.target === lightbox) {
    lightbox.classList.remove("open");
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    lightbox.classList.remove("open");
  }
});
</script>
<script src="../js/cloud-config.js"></script>
<script type="module" src="../js/cloud-works.js"></script>
<script type="module" src="../js/jheyvx-widget.js"></script>
</body>
</html>
