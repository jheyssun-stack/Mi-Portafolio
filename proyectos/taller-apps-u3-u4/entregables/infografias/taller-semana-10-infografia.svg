<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Semana 10: Inserción y consulta de datos</title><desc id="desc">Infografía del proyecto JHEYVX TECH, semana 10</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071014"/><stop offset="1" stop-color="#10242a"/></linearGradient><linearGradient id="c"><stop stop-color="#21bfd8"/><stop offset="1" stop-color="#74f5ff"/></linearGradient></defs><rect width="1080" height="1350" rx="36" fill="url(#g)"/><circle cx="935" cy="170" r="230" fill="#00dfff" opacity=".06"/><circle cx="85" cy="1190" r="260" fill="#00dfff" opacity=".04"/><text x="78" y="100" fill="#72efff" font-family="Arial" font-weight="700" font-size="26" letter-spacing="5">JHEYVX TECH  /  TALLER II</text><text x="78" y="236" fill="url(#c)" font-family="Arial" font-weight="800" font-size="110">10</text><text x="80" y="306" fill="#f0fbfc" font-family="Arial" font-weight="700" font-size="33">SEMANA</text><text x="80" y="390" fill="#f0fbfc" font-family="Arial" font-weight="800" font-size="42">INSERCIÓN Y CONSULTA DE DAT</text><text x="80" y="444" fill="#f0fbfc" font-family="Arial" font-weight="800" font-size="42">OS</text><rect x="78" y="495" width="924" height="3" rx="2" fill="url(#c)" opacity=".8"/><text x="80" y="565" fill="#72efff" font-family="Arial" font-size="21" font-weight="700" letter-spacing="3">OBJETIVO</text><foreignObject x="80" y="590" width="900" height="150"><div xmlns="http://www.w3.org/1999/xhtml" style="font:24px/1.5 Arial,sans-serif;color:#c3d8dd">Implementar el registro de productos y la consulta de datos persistidos. Las búsquedas se parametrizan para evitar concatenar valores del usuario en el SQL.</div></foreignObject><text x="80" y="795" fill="#72efff" font-family="Arial" font-size="21" font-weight="700" letter-spacing="3">FLUJO</text><rect x="78" y="820" width="924" height="145" rx="20" fill="#0d1d22" stroke="#20505a"/><foreignObject x="108" y="845" width="865" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:21px/1.5 Consolas,monospace;color:#f0fbfc">Formulario validado → PreparedStatement INSERT → confirmación → SELECT filtrado</div></foreignObject><text x="80" y="1025" fill="#72efff" font-family="Arial" font-size="21" font-weight="700" letter-spacing="3">EVIDENCIA</text><foreignObject x="80" y="1050" width="900" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.5 Arial,sans-serif;color:#c3d8dd">Al reiniciar el programa, los productos guardados continúan disponibles en la base local.<br/><br/><b style="color:#72efff">InventoryService.java · Inventario Swing · JDBC</b></div></foreignObject><text x="80" y="1290" fill="#809ba2" font-family="Arial" font-size="18">Jheyssun Breydi Vargas Taipe · Java Swing · JDBC · H2</text></svg>