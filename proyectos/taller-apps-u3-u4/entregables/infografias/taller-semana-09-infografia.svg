circle cx="606" cy="447" r="15" fill="#8eb8d0"/><text x="606" y="452" class="num" text-anchor="middle">04</text><text x="634" y="449" class="body"><tspan x="634" dy="0">La conexión local funciona con almacenamiento del navega</tspan><tspan x="634" dy="22">dor.</tspan></text><text x="70" y="604" class="foot">JHEYSSUN BREYDI VARGAS TAIPE · PORTAFOLIO ACADÉMICO · 2026</text><style>.title{font:700 45px Manrope,Arial,sans-serif;fill:#f0f2ee;letter-spacing:-1.6px}.sub{font:16px Arial,sans-serif;fill:#aab5b8}.tag,.cap,.foot{font:12px monospace;fill:#8eb8d0;letter-spacing:1.4px}.cap{fill:#8a989c}.num{font:700 10px Arial;fill:#101518}.body{font:15px Arial,sans-serif;fill:#dce2df}</style></svg>