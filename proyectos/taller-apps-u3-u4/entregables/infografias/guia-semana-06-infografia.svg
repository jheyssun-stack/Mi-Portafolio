<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="766" viewBox="0 0 1100 766" role="img" aria-labelledby="title desc"><title id="title">Integración Full-Stack</title><desc id="desc">Infografía académica original de Jheyssun Vargas: Guía de actividades · síntesis original de los temas solicitados</desc><rect width="100%" height="100%" rx="22" fill="#0b1014"/><path d="M750 0h350v180L900 270 650 175z" fill="#76b7b0" opacity=".1"/><text x="70" y="75" class="tag">JHEYVX · GUÍA DE ACTIVIDADES · SEMANA 06</text><text x="70" y="154" class="title">Integración Full-Stack</text><text x="70" y="198" class="sub">Guía de actividades · síntesis original de los temas solicitados</text><path d="M70 235h960" stroke="#76b7b0" opacity=".45"/><text x="70" y="276" class="cap">IDEAS CLAVE · RESUMEN PARA ESTUDIO</text><rect x="70" y="300" width="480" height="104" rx="12" fill="#151d23" stroke="#2b3740"/><circle cx="98" cy="329" r="15" fill="#76b7b0"/><text x="98" y="334" class="num" text-anchor="middle">01</text><text x="126" y="331" class="body"><tspan x="126" dy="0">React consume endpoints del backend por HTTP.</tspan></text><rect x="578" y="300" width="480" height="104" rx="12" fill="#151d23" stroke="#2b3740"/><circle cx="606" cy="329" r="15" fill="#76b7b0"/><text x="606" y="334" class="num" text-anchor="middle">02</text><text x="634" y="331" class="body"><tspan x="634" dy="0">Fetch/Axios envían JSON y leen respuestas.</tspan></text><rect x="70" y="418" width="480" height="104" rx="12" fill="#151d23" stroke="#2b3740"/><circle cx="98" cy="447" r="15" fill="#76b7b0"/><text x="98" y="452" class="num" text-anchor="middle">03</text><text x="126" y="449" class="body"><tspan x="126" dy="0">El CRUD completo incluye listar, crear, editar y borrar.</tspan></text><rect x="578" y="418" width="480" height="104" rx="12" fill="#151d23" stroke="#2b3740"/><circle cx="606" cy="447" r="15" fill="#76b7b0"/><text x="606" y="452" class="num" text-anchor="middle">04</text><text x="634" y="449" class="body"><tspan x="634" dy="0">Mostrar estados de carga y error mejora claridad.</tspan></text><rect x="70" y="536" width="480" height="104" rx="12" fill="#151d23" stroke="#2b3740"/><circle cx="98" cy="565" r="15" fill="#76b7b0"/><text x="98" y="570" class="num" text-anchor="middle">05</text><text x="126" y="567" class="body"><tspan x="126" dy="0">Backend vuelve a validar; la interfaz no es frontera de </tspan><tspan x="126" dy="22">seguridad.</tspan></text><text x="70" y="722" class="foot">JHEYSSUN BREYDI VARGAS TAIPE · PORTAFOLIO ACADÉMICO · 2026</text><style>.title{font:700 45px Manrope,Arial,sans-serif;fill:#f0f2ee;letter-spacing:-1.6px}.sub{font:16px Arial,sans-serif;fill:#aab5b8}.tag,.cap,.foot{font:12px monospace;fill:#76b7b0;letter-spacing:1.4px}.cap{fill:#8a989c}.num{font:700 10px Arial;fill:#101518}.body{font:15px Arial,sans-serif;fill:#dce2df}</style></svg>