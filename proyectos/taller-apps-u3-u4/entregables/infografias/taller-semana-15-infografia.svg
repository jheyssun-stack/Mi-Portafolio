<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc"><title id="title">Semana 15: Empaquetado y ejecución del proyecto</title><desc id="desc">Infografía del proyecto JHEYVX TECH, semana 15</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071014"/><stop offset="1" stop-color="#10242a"/></linearGradient><linearGradient id="c"><stop stop-color="#21bfd8"/><stop offset="1" stop-color="#74f5ff"/></linearGradient></defs><rect width="1080" height="1350" rx="36" fill="url(#g)"/><circle cx="935" cy="170" r="230" fill="#00dfff" opacity=".06"/><circle cx="85" cy="1190" r="260" fill="#00dfff" opacity=".04"/><text x="78" y="100" fill="#72efff" font-family="Arial" font-weight="700" font-size="26" letter-spacing="5">JHEYVX TECH  /  TALLER II</text><text x="78" y="236" fill="url(#c)" font-family="Arial" font-weight="800" font-size="110">15</text><text x="80" y="306" fill="#f0fbfc" font-family="Arial" font-weight="700" font-size="33">SEMANA</text><text x="80" y="390" fill="#f0fbfc" font-family="Arial" font-weight="800" font-size="42">EMPAQUETADO Y EJECUCIÓN DEL</text><text x="80" y="444" fill="#f0fbfc" font-family="Arial" font-weight="800" font-size="42"> PROYECTO</text><rect x="78" y="495" width="924" height="3" rx="2" fill="url(#c)" opacity=".8"/><text x="80" y="565" fill="#72efff" font-family="Arial" font-size="21" font-weight="700" letter-spacing="3">OBJETIVO</text><foreignObject x="80" y="590" width="900" height="150"><div xmlns="http://www.w3.org/1999/xhtml" style="font:24px/1.5 Arial,sans-serif;color:#c3d8dd">Empaquetar clases y dependencias en un JAR ejecutable con clase principal declarada. La aplicación no requiere VPS: corre localmente y guarda sus datos en la carpeta data.</div></foreignObject><text x="80" y="795" fill="#72efff" font-family="Arial" font-size="21" font-weight="700" letter-spacing="3">FLUJO</text><rect x="78" y="820" width="924" height="145" rx="20" fill="#0d1d22" stroke="#20505a"/><foreignObject x="108" y="845" width="865" height="105"><div xmlns="http://www.w3.org/1999/xhtml" style="font:21px/1.5 Consolas,monospace;color:#f0fbfc">mvn clean test package → JAR autocontenido → Java 8+ → base local H2</div></foreignObject><text x="80" y="1025" fill="#72efff" font-family="Arial" font-size="21" font-weight="700" letter-spacing="3">EVIDENCIA</text><foreignObject x="80" y="1050" width="900" height="160"><div xmlns="http://www.w3.org/1999/xhtml" style="font:23px/1.5 Arial,sans-serif;color:#c3d8dd">Artefacto generado: target/JHEYVX-Tech-Desktop.jar. GitHub Pages presenta y distribuye los archivos, pero no ejecuta Swing.<br/><br/><b style="color:#72efff">Maven Shade Plugin · Manifest Main-Class · JAR</b></div></foreignObject><text x="80" y="1290" fill="#809ba2" font-family="Arial" font-size="18">Jheyssun Breydi Vargas Taipe · Java Swing · JDBC · H2</text></svg>